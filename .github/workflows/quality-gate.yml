name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tutorflow_test
          POSTGRES_USER: tutorflow
          POSTGRES_PASSWORD: tutorflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorflow -d tutorflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tutorflow:tutorflow_test@localhost:5432/tutorflow_test
      FILE_STORAGE_PATH: /tmp/tutorflow-uploads
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Run Python tests
        run: python -m pytest -q
      - name: Measure Artyom schedule coverage
        run: >-
          python -m pytest tests/test_schedule_pz02.py -q
          --cov=app.services
          --cov=app.web.router
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage-artem.xml
          --cov-report=json:coverage-artem.json
      - name: Upload Artyom schedule coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-artem
          path: |
            coverage-artem.xml
            coverage-artem.json
          if-no-files-found: warn
      - name: Run JavaScript tests
        run: |
          node --test tests/auth-wizard.test.cjs tests/student-lifecycle.test.cjs
          node tests/test_session_fetch.cjs
      - name: Validate migrations on PostgreSQL
        run: |
          python -m alembic upgrade head
          test "$(python -m alembic heads | grep -c '(head)')" -eq 1
          python -m alembic current
          python -m alembic check
