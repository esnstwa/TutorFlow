name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tutorflow_test
          POSTGRES_USER: tutorflow
          POSTGRES_PASSWORD: tutorflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorflow -d tutorflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://tutorflow:tutorflow_test@localhost:5432/tutorflow_test
      FILE_STORAGE_PATH: ${{ runner.temp }}/tutorflow-uploads
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run JavaScript tests
        run: |
          node --test tests/auth-wizard.test.cjs tests/student-lifecycle.test.cjs
          node tests/test_session_fetch.cjs
      - name: Validate migrations on PostgreSQL
        run: |
          python -m alembic upgrade head
          test "$(python -m alembic heads | grep -c '(head)')" -eq 1
          python -m alembic current
          python -m alembic check
