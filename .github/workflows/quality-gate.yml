name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tutorflow_test
          POSTGRES_USER: tutorflow
          POSTGRES_PASSWORD: tutorflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorflow -d tutorflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tutorflow:tutorflow_test@localhost:5432/tutorflow_test
      FILE_STORAGE_PATH: /tmp/tutorflow-uploads
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install locked Python dependencies
        run: python -m pip install uv==0.11.21 && uv sync --locked --extra dev
      - name: Compile Python sources
        run: uv run --locked --no-sync python -m compileall -q app
      - name: Verify minimal runtime component
        env:
          TUTORFLOW_EXPECTED_SHA: ${{ github.sha }}
        run: uv run --locked --no-sync python scripts/check_component.py
      - name: Verify component check rejects a mismatched SHA
        run: |
          set +e
          output="$(uv run --locked --no-sync python scripts/check_component.py --expected-sha 000000000000 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ] || ! printf '%s' "$output" | grep -Fq "SHA не совпал"; then
            echo "component check did not reject the mismatched SHA as expected" >&2
            exit 1
          fi
      - name: Run Python tests
        run: uv run --locked --no-sync python -m pytest -q
      - name: Run JavaScript tests
        run: |
          node --test tests/auth-wizard.test.cjs tests/student-lifecycle.test.cjs
          node tests/test_session_fetch.cjs
      - name: Validate migrations on PostgreSQL
        run: |
          uv run --locked --no-sync python -m alembic upgrade head
          test "$(uv run --locked --no-sync python -m alembic heads | grep -c '(head)')" -eq 1
          uv run --locked --no-sync python -m alembic current
          uv run --locked --no-sync python -m alembic check
      - name: Measure schedule coverage
        run: >-
          uv run --locked --no-sync python -m pytest tests/test_schedule_pz02.py -q
          --cov=app.services
          --cov=app.web.router
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage-schedule.xml
          --cov-report=json:coverage-schedule.json
      - name: Build and verify wheel package
        run: >-
          uv run --locked --no-sync python scripts/build_component.py wheel
          --out-dir "$RUNNER_TEMP/tutorflow-wheel"
          --work-dir "$RUNNER_TEMP"
      - name: Verify installed wheel outside checkout and in another Git repository
        run: >-
          uv run --locked --no-sync python scripts/verify_wheel_runtime.py
          --wheel "$RUNNER_TEMP/tutorflow-wheel/tutorflow-0.1.0-py3-none-any.whl"
          --expected-sha "$(git rev-parse --short=12 HEAD)"
      - name: Upload schedule coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-schedule
          path: |
            coverage-schedule.xml
            coverage-schedule.json
          if-no-files-found: warn
