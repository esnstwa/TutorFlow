<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231a2cff' d='m16 2 4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z'/%3E%3C/svg%3E">
    <title>{% block title %}TutorFlow{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/tokens.css') }}?v={{ static_version('css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/base.css') }}?v={{ static_version('css/base.css') }}">
    {% block styles %}{% endblock %}
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}
    <meta name="csrf-token" content="{{ request.state.csrf_token|default('', true) }}">
    <script src="{{ url_for('static', path='/js/session.js') }}?v={{ static_version('js/session.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
