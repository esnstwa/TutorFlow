<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}TutorFlow{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/tokens.css') }}?v={{ static_version('css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/base.css') }}?v={{ static_version('css/base.css') }}">
    {% block styles %}{% endblock %}
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
