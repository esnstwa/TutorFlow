services:
  web:
    build: .
    environment:
      APP_NAME: TutorFlow
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tutorflow}:${POSTGRES_PASSWORD:-tutorflow}@db:5432/${POSTGRES_DB:-tutorflow}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutorflow}
      POSTGRES_USER: ${POSTGRES_USER:-tutorflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutorflow} -d ${POSTGRES_DB:-tutorflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
